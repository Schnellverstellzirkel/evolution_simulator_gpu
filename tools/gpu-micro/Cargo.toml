# Standalone GPU microbenchmarks. Not part of
# the game's build: the empty [workspace] makes this its own workspace root.
[package]
name = "gpu-micro"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
ash = "0.38"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }

[workspace]
