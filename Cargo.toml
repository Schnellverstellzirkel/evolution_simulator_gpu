[package]
name = "evolution-simulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "accesskit"] }
egui_plot = "0.37"
wgpu = "30.0"
pollster = "0.4"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
zstd = "0.13"
csv = "1"
ctrlc = "3.4"
image = { version = "0.25", default-features = false, features = ["png"] }
ash = "0.38"
libc = "0.2"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }

[profile.release]
lto = "thin"
codegen-units = 16
